name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '0 3 * * 1' # Mondays: catch breaking changes in Sylius and friends

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                dependencies: [highest]
                include:
                    - php: '8.2'
                      dependencies: lowest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: intl, gd, exif, fileinfo, sodium
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}

            - name: Coding standard
              run: vendor/bin/ecs check --no-progress-bar

            - name: Static analysis
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Tests
              run: vendor/bin/phpunit
