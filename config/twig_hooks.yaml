sylius_twig_hooks:
    hooks:
        # Shop: make the shipping step's live form actually live in the browser.
        # Sylius's own entry is replaced rather than amended: hook props merge, and Sylius
        # passes an "order" prop the component does not declare, harmless only while the
        # attributes are not printed. Same props as Sylius's address step instead.
        'sylius_shop.checkout.select_shipping.content':
            form:
                enabled: false
            universal_shipping_form:
                component: 'sylius_shop:checkout:shipping:form'
                props:
                    resource: '@=_context.order'
                    form: '@=_context.form'
                    template: '@UniversalShippingPlugin/shop/checkout/select_shipping/form.html.twig'
                priority: 0

        # Shop: the map's script and styles, on checkout pages only and only when the map is on.
        # Loaded with the page, not inside the live form, so they survive its re-renders.
        # Same for the address autocomplete, when address.autocomplete is on.
        'sylius_shop.checkout#stylesheets':
            universal_shipping_map:
                template: '@UniversalShippingPlugin/shop/checkout/map/stylesheets.html.twig'
                priority: -100
            universal_shipping_address:
                template: '@UniversalShippingPlugin/shop/checkout/address/stylesheets.html.twig'
                priority: -110
            universal_shipping_search:
                template: '@UniversalShippingPlugin/shop/checkout/search/stylesheets.html.twig'
                priority: -120

        'sylius_shop.checkout#javascripts':
            universal_shipping_map:
                template: '@UniversalShippingPlugin/shop/checkout/map/javascripts.html.twig'
                priority: -100
            universal_shipping_address:
                template: '@UniversalShippingPlugin/shop/checkout/address/javascripts.html.twig'
                priority: -110
            universal_shipping_search:
                template: '@UniversalShippingPlugin/shop/checkout/search/javascripts.html.twig'
                priority: -120

        # Shop: the picker, under the shipping methods of each shipment.
        'sylius_shop.checkout.select_shipping.content.form.shipments.shipment':
            universal_shipping_pickup_point:
                template: '@UniversalShippingPlugin/shop/checkout/select_shipping/pickup_point.html.twig'
                priority: -100

        # Shop: for a pickup point order, the summary's shipping address box shows the point,
        # not the customer's own address (checkout's last step and the customer's order page).
        'sylius_shop.shared.order.show.summary.addresses.shipping':
            header:
                template: '@UniversalShippingPlugin/shop/order/summary/shipping_header.html.twig'
                priority: 100
            body:
                template: '@UniversalShippingPlugin/shop/order/summary/shipping_body.html.twig'
                priority: 0

        # Shop: the chosen point in the checkout summary and the customer's order page.
        'sylius_shop.checkout.complete.content.form.summary.statuses.shipments.list':
            universal_shipping_pickup_point:
                template: '@UniversalShippingPlugin/shop/order/pickup_point.html.twig'
                priority: 50

        'sylius_shop.shared.order.show.summary.statuses.shipments.list':
            universal_shipping_pickup_point:
                template: '@UniversalShippingPlugin/shop/order/pickup_point.html.twig'
                priority: 50

        # Admin: which delivery option a shipping method uses.
        'sylius_admin.shipping_method.create.content.form.general':
            universal_shipping_delivery_option:
                template: '@UniversalShippingPlugin/admin/shipping_method/form/delivery_option.html.twig'
                priority: 50

        'sylius_admin.shipping_method.update.content.form.general':
            universal_shipping_delivery_option:
                template: '@UniversalShippingPlugin/admin/shipping_method/form/delivery_option.html.twig'
                priority: 50

        # Admin: for a pickup point order, the customer section's "Shipping address" is only
        # the customer's own address; says so, and names the point.
        'sylius_admin.order.show.content.sections.customer':
            shipping_address:
                template: '@UniversalShippingPlugin/admin/order/show/customer_shipping_address.html.twig'
                priority: 100

        # Admin: the chosen point and the parcel's tracking on the order page.
        'sylius_admin.order.show.content.sections.shipments.item.general':
            universal_shipping_pickup_point:
                template: '@UniversalShippingPlugin/admin/order/show/pickup_point.html.twig'
                priority: 150
            universal_shipping_parcel:
                template: '@UniversalShippingPlugin/admin/order/show/parcel.html.twig'
                priority: 140

        # Admin: create, print and cancel the label, next to Sylius's "Ship" button.
        'sylius_admin.order.show.content.sections.shipments.item.actions':
            universal_shipping_label:
                template: '@UniversalShippingPlugin/admin/order/show/label_actions.html.twig'
                priority: 300
